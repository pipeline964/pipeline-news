<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실시간 뉴스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Roboto+Mono:wght@500&display=swap">
<style>
  :root{
    --page:#ffffff; --text:#2f2f2c; --sub:#8b8b87; --line:#ececea; --hover:#f6f6f4;
    --chip:#f1f1ef; --chip-on:#1f1f1e; --chip-on-text:#ffffff; --live:#e5484d;
    --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    --mono:"Roboto Mono",ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{ --page:#191919; --text:#e6e6e4; --sub:#8f8f8c; --line:#2c2c2b; --hover:#232322;
      --chip:#262625; --chip-on:#e6e6e4; --chip-on-text:#191919; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--page);color:var(--text);font-family:var(--sans)}
  body{padding:4px 2px 8px}
  .head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .ttl{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;letter-spacing:.02em}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 rgba(229,72,77,.5);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.45)}70%{box-shadow:0 0 0 6px rgba(229,72,77,0)}100%{box-shadow:0 0 0 0 rgba(229,72,77,0)}}
  @media (prefers-reduced-motion: reduce){ .dot{animation:none} }
  .meta{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;color:var(--sub)}
  .btn{border:0;background:transparent;color:var(--sub);cursor:pointer;font-size:13px;line-height:1;padding:3px 4px;border-radius:5px}
  .btn:hover{background:var(--hover);color:var(--text)}
  .btn.spin{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
  .chip{display:inline-flex;align-items:center;gap:4px;border:0;cursor:pointer;font-family:var(--sans);
    font-size:11px;font-weight:500;padding:4px 9px;border-radius:999px;background:var(--chip);color:var(--text);white-space:nowrap}
  .chip.on{background:var(--chip-on);color:var(--chip-on-text)}
  .chip .x{opacity:.55;font-size:10px}
  .chip .x:hover{opacity:1}
  .chip.add{background:transparent;border:1px dashed var(--line);color:var(--sub)}
  .addbox{display:none;gap:5px;margin-bottom:8px}
  .addbox.show{display:flex}
  .addbox input{flex:1;min-width:0;font:inherit;font-size:12px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--page);color:var(--text)}
  .addbox button{font:inherit;font-size:12px;padding:5px 9px;border:0;border-radius:7px;background:var(--chip-on);color:var(--chip-on-text);cursor:pointer}

  ul{list-style:none;border-top:1px solid var(--line)}
  li a{display:block;padding:9px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;border-radius:4px}
  li a:hover{background:var(--hover)}
  .t{font-size:12.5px;font-weight:500;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
  .s{margin-top:4px;font-size:10.5px;color:var(--sub);display:flex;gap:6px;white-space:nowrap;overflow:hidden}
  .s .src{overflow:hidden;text-overflow:ellipsis}
  .new{color:var(--live);font-weight:600}
  .msg{padding:16px 4px;font-size:12px;color:var(--sub);line-height:1.6}
  .msg a{color:var(--text)}
  .sk{height:46px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
  .sk::before{content:"";position:absolute;left:4px;right:30%;top:10px;height:10px;border-radius:4px;background:var(--chip)}
  .sk::after{content:"";position:absolute;left:4px;right:65%;top:28px;height:8px;border-radius:4px;background:var(--chip)}
</style>
</head>
<body>
  <div class="head">
    <div class="ttl"><span class="dot"></span>LIVE NEWS</div>
    <div class="meta"><span id="upd">—</span><button class="btn" id="refresh" title="새로고침" aria-label="새로고침">↻</button></div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="addbox" id="addbox">
    <input id="kw" placeholder="키워드 입력 (예: SaaS 투자)" maxlength="40">
    <button id="kwok">추가</button>
  </div>
  <ul id="list"></ul>

<script>
  var DEFAULT_TOPICS = [
    { label: "주요 뉴스", q: "" },
    { label: "스타트업 투자", q: "스타트업 투자 유치" },
    { label: "IT 외주", q: "IT 외주 개발" },
    { label: "개발자 채용", q: "개발자 채용 스타트업" },
    { label: "미국 테크", q: "미국 테크 스타트업" }
  ];
  var MAX_ITEMS = 12, REFRESH_MS = 10 * 60 * 1000;
  var STORE = "pipeline-news-v1";

  function load(){ try { return JSON.parse(localStorage.getItem(STORE) || "{}"); } catch (e) { return {}; } }
  function save(s){ try { localStorage.setItem(STORE, JSON.stringify(s)); } catch (e) {} }
  var state = load();
  var custom = Array.isArray(state.custom) ? state.custom : [];
  var active = typeof state.active === "number" ? state.active : 0;

  function topics(){ return DEFAULT_TOPICS.concat(custom.map(function(q){ return { label: q, q: q, custom: true }; })); }

  function feedUrl(q){
    return q
      ? "https://news.google.com/rss/search?q=" + encodeURIComponent(q + " when:7d") + "&hl=ko&gl=KR&ceid=KR:ko"
      : "https://news.google.com/rss?hl=ko&gl=KR&ceid=KR:ko";
  }
  function webUrl(q){
    return q ? "https://news.google.com/search?q=" + encodeURIComponent(q) + "&hl=ko&gl=KR&ceid=KR:ko"
             : "https://news.google.com/?hl=ko&gl=KR&ceid=KR:ko";
  }

  function withTimeout(p, ms){
    return new Promise(function(res, rej){
      var t = setTimeout(function(){ rej(new Error("timeout")); }, ms);
      p.then(function(v){ clearTimeout(t); res(v); }, function(e){ clearTimeout(t); rej(e); });
    });
  }
  function splitTitle(t){
    var i = t.lastIndexOf(" - ");
    return i > 0 ? { title: t.slice(0, i), src: t.slice(i + 3) } : { title: t, src: "" };
  }
  function parseXml(text){
    var doc = new DOMParser().parseFromString(text, "text/xml");
    var items = Array.prototype.slice.call(doc.getElementsByTagName("item"));
    if (!items.length) throw new Error("no items");
    return items.map(function(it){
      function g(tag){ var n = it.getElementsByTagName(tag)[0]; return n ? n.textContent : ""; }
      var st = splitTitle(g("title"));
      return { title: st.title, src: g("source") || st.src, link: g("link"), date: new Date(g("pubDate")) };
    });
  }
  // 1) rss2json (JSON, CORS 허용)
  function viaRss2json(url){
    return fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(url))
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(j){
        if (j.status !== "ok" || !j.items || !j.items.length) throw new Error("rss2json");
        return j.items.map(function(it){
          var st = splitTitle(it.title || "");
          return { title: st.title, src: st.src || it.author || "", link: it.link,
                   date: new Date((it.pubDate || "").replace(" ", "T") + "Z") };
        });
      });
  }
  // 2) XML 프록시
  function viaProxy(prefix){
    return function(url){
      return fetch(prefix + encodeURIComponent(url))
        .then(function(r){ if (!r.ok) throw new Error(r.status); return r.text(); })
        .then(parseXml);
    };
  }
  var SOURCES = [
    viaRss2json,
    viaProxy("https://api.allorigins.win/raw?url="),
    viaProxy("https://corsproxy.io/?url=")
  ];

  function fetchFeed(url){
    var i = 0;
    function next(){
      if (i >= SOURCES.length) return Promise.reject(new Error("all failed"));
      var fn = SOURCES[i++];
      return withTimeout(fn(url), 9000).catch(next);
    }
    return next();
  }

  function ago(d){
    if (isNaN(d)) return "";
    var m = Math.round((Date.now() - d.getTime()) / 60000);
    if (m < 1) return "방금";
    if (m < 60) return m + "분 전";
    var h = Math.round(m / 60);
    if (h < 24) return h + "시간 전";
    return Math.round(h / 24) + "일 전";
  }
  function pad(n){ return (n < 10 ? "0" : "") + n; }

  var listEl = document.getElementById("list");
  var chipsEl = document.getElementById("chips");
  var updEl = document.getElementById("upd");
  var refBtn = document.getElementById("refresh");
  var addbox = document.getElementById("addbox");
  var kw = document.getElementById("kw");
  var reqId = 0;

  function renderChips(){
    chipsEl.textContent = "";
    topics().forEach(function(t, idx){
      var b = document.createElement("button");
      b.className = "chip" + (idx === active ? " on" : "");
      b.textContent = t.label;
      b.onclick = function(){ active = idx; persist(); renderChips(); refresh(); };
      if (t.custom){
        var x = document.createElement("span");
        x.className = "x"; x.textContent = "✕"; x.title = "삭제";
        x.onclick = function(ev){
          ev.stopPropagation();
          custom.splice(idx - DEFAULT_TOPICS.length, 1);
          if (active === idx) active = 0; else if (active > idx) active--;
          persist(); renderChips(); refresh();
        };
        b.appendChild(x);
      }
      chipsEl.appendChild(b);
    });
    var add = document.createElement("button");
    add.className = "chip add"; add.textContent = "＋ 키워드";
    add.onclick = function(){ addbox.classList.toggle("show"); if (addbox.classList.contains("show")) kw.focus(); };
    chipsEl.appendChild(add);
  }
  function persist(){ save({ custom: custom, active: active }); }

  function addKeyword(){
    var v = kw.value.trim();
    if (!v) return;
    if (custom.indexOf(v) < 0) custom.push(v);
    active = topics().length - 1;
    for (var i = 0; i < topics().length; i++) if (topics()[i].q === v) active = i;
    kw.value = ""; addbox.classList.remove("show");
    persist(); renderChips(); refresh();
  }
  document.getElementById("kwok").onclick = addKeyword;
  kw.addEventListener("keydown", function(e){ if (e.key === "Enter") addKeyword(); if (e.key === "Escape") addbox.classList.remove("show"); });

  function skeleton(){
    listEl.textContent = "";
    for (var i = 0; i < 5; i++){ var li = document.createElement("li"); li.className = "sk"; listEl.appendChild(li); }
  }
  function renderItems(items){
    listEl.textContent = "";
    items.sort(function(a, b){ return (b.date || 0) - (a.date || 0); });
    items.slice(0, MAX_ITEMS).forEach(function(it){
      var li = document.createElement("li"), a = document.createElement("a");
      a.href = it.link; a.target = "_blank"; a.rel = "noopener noreferrer";
      var t = document.createElement("div"); t.className = "t"; t.textContent = it.title;
      var s = document.createElement("div"); s.className = "s";
      var fresh = !isNaN(it.date) && (Date.now() - it.date.getTime()) < 3 * 3600000;
      if (fresh){ var n = document.createElement("span"); n.className = "new"; n.textContent = "NEW"; s.appendChild(n); }
      var src = document.createElement("span"); src.className = "src"; src.textContent = it.src;
      var tm = document.createElement("span"); tm.textContent = ago(it.date);
      s.appendChild(src); if (it.src && tm.textContent) s.appendChild(document.createTextNode("·")); s.appendChild(tm);
      a.appendChild(t); a.appendChild(s); li.appendChild(a); listEl.appendChild(li);
    });
  }
  function renderError(q){
    listEl.textContent = "";
    var li = document.createElement("li"); li.className = "msg";
    li.appendChild(document.createTextNode("뉴스를 불러오지 못했어요. 잠시 후 ↻ 를 눌러주세요. "));
    var a = document.createElement("a"); a.href = webUrl(q); a.target = "_blank"; a.rel = "noopener noreferrer";
    a.textContent = "Google 뉴스에서 바로 보기 →";
    li.appendChild(a); listEl.appendChild(li);
  }

  function refresh(){
    var my = ++reqId, t = topics()[active] || topics()[0];
    skeleton(); refBtn.classList.add("spin");
    fetchFeed(feedUrl(t.q)).then(function(items){
      if (my !== reqId) return;
      renderItems(items);
      var d = new Date(); updEl.textContent = pad(d.getHours()) + ":" + pad(d.getMinutes()) + " 업데이트";
    }).catch(function(){
      if (my !== reqId) return;
      renderError(t.q); updEl.textContent = "연결 실패";
    }).then(function(){ if (my === reqId) refBtn.classList.remove("spin"); });
  }
  refBtn.onclick = refresh;

  if (active >= topics().length) active = 0;
  renderChips();
  refresh();
  setInterval(function(){ if (!document.hidden) refresh(); }, REFRESH_MS);
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) {
    var t = updEl.textContent; if (t === "연결 실패") refresh();
  }});
</script>
</body>
</html>
